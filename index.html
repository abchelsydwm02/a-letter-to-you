<script>

/* PASSWORD */

const PASSWORD = "12345";

let input = "";

const display =
document.getElementById("display");

document.querySelectorAll(".key")
.forEach(button=>{

    button.addEventListener("click",()=>{

        const value =
        button.innerText;

        if(value === "⌫"){

            input =
            input.slice(0,-1);

        }

        else if(value === "💖"){

            if(input === PASSWORD){

                document
                .getElementById("passwordPage")
                .classList.add("hidden");

                document
                .getElementById("tetrisPage")
                .classList.remove("hidden");

                startTetris();

            }

            else{

                alert("Password salah 💔");

                input = "";

            }

        }

        else{

            if(input.length < 5){

                input += value;

            }

        }

        display.innerText =
        "•".repeat(input.length);

    });

});

/* MINI TETRIS */

function startTetris(){

    const board =
    document.getElementById("tetris");

    for(let i=0;i<200;i++){

        const block =
        document.createElement("div");

        block.classList.add("block");

        board.appendChild(block);

    }

    const blocks =
    document.querySelectorAll(".block");

    let pos = 0;

    const interval =
    setInterval(()=>{

        blocks.forEach(b=>
        b.classList.remove("active"));

        for(let i=0;i<4;i++){

            if(blocks[pos+i]){

                blocks[pos+i]
                .classList.add("active");

            }

        }

        pos += 10;

        if(pos > 180){

            pos = 0;

        }

    },300);

    setTimeout(()=>{

        clearInterval(interval);

        document
        .getElementById("tetrisPage")
        .classList.add("hidden");

        document
        .getElementById("envelopePage")
        .classList.remove("hidden");

    },8000);

}

`Cie...cie ada yang lagi butterfly era nih? senyumnya ga bisa bohong, dia baik banget ya sama kamu? Bahagia selalu ya, I wish senyum yang merekah hari ini akan merekah seterusnya. Happy for you`,

`lagi capek ya sama dunia? it's okay, dunia emang tempatnya capek,tapi kamu harus tetap percaya disetiap kesulitan pasti ada kemudahan,badainya akan berlalu, di depan sana ada kebahagian yang menanti kamu, Terima kasih ya sudah berjuang sejauh ini, kamu tuh hebat banget...sedikit lagi jangan nyerah. Okay?`

];

function openLetter(index){

    createFlowers();

    document
    .getElementById("envelopePage")
    .classList.add("hidden");

    document
    .getElementById("letterPage")
    .classList.remove("hidden");

    document
    .getElementById("text")
    .innerHTML = "";

    typeWriter(letters[index]);

}

/* TYPE EFFECT */

function typeWriter(message){

    let i = 0;

    function typing(){

        if(i < message.length){

            document
            .getElementById("text")
            .innerHTML +=
            message.charAt(i);

            i++;

            setTimeout(typing,35);

        }

    }

    typing();

}

/* FLOWERS */

function createFlowers(){

    for(let i=0;i<50;i++){

        const flower =

        (Math.random()*3 + 4) + "s";

        document.body.appendChild(flower);

        setTimeout(()=>{

            flower.remove();

        },7000);

    }

}
